# Local development and smoke-test Compose stack.
#
# This is the default file used by `docker compose up`. It builds the image
# from the current checkout and does not pull from GHCR.

x-llmc-environment: &llmc-environment # Bootstrap environment read before YAML loading.
  HOST: "${HOST:-0.0.0.0}"
  PORT: "${PORT:-3010}"
  CONFIG_FILE: "${CONFIG_FILE:-config/llm-context-loader.yaml}"
  LOG_LEVEL: "${LOG_LEVEL:-info}"
  LOG_PRETTY: "${LOG_PRETTY:-auto}"

  # Active pipeline selected by HTTP adapters.
  DEFAULT_PIPELINE: "${DEFAULT_PIPELINE:-truncate}"

  # Pipeline concurrency and renderer selection.
  SOURCE_CONCURRENCY: "${SOURCE_CONCURRENCY:-1}"
  LLM_CONCURRENCY: "${LLM_CONCURRENCY:-1}"
  DEFAULT_OUTPUT_RENDERER: "${DEFAULT_OUTPUT_RENDERER:-debug-xml}"
  DEBUG_XML_INCLUDE_SKIPPED: "${DEBUG_XML_INCLUDE_SKIPPED:-false}"
  OUTPUT_TARGET_CHARS: "${OUTPUT_TARGET_CHARS:-25000}"

  # Source provider.
  SOURCE_PROVIDER: "${SOURCE_PROVIDER:-default-http}"
  FIRECRAWL_BASE_URL: "${FIRECRAWL_BASE_URL:-}"
  FIRECRAWL_API_KEY: "${FIRECRAWL_API_KEY:-}"
  DOCLING_BASE_URL: "${DOCLING_BASE_URL:-}"
  DOCLING_API_KEY: "${DOCLING_API_KEY:-}"

  # LLM provider.
  LLM_BASE_URL: "${LLM_BASE_URL:-}"
  LLM_API_KEY: "${LLM_API_KEY:-}"
  LLM_MODEL: "${LLM_MODEL:-}"
  LLM_CONTEXT_TOKENS: "${LLM_CONTEXT_TOKENS:-}"
  LLM_CHARS_PER_TOKEN: "${LLM_CHARS_PER_TOKEN:-3.5}"
  LLM_SAFETY_MARGIN_TOKENS: "${LLM_SAFETY_MARGIN_TOKENS:-128}"

  # Step thresholds and timeouts.
  LOAD_SOURCE_TIMEOUT_SECONDS: "${LOAD_SOURCE_TIMEOUT_SECONDS:-20}"
  CLEAN_TIMEOUT_SECONDS: "${CLEAN_TIMEOUT_SECONDS:-60}"
  CLEAN_MIN_INPUT_CHARS: "${CLEAN_MIN_INPUT_CHARS:-1000}"
  SUMMARIZE_TIMEOUT_SECONDS: "${SUMMARIZE_TIMEOUT_SECONDS:-60}"

  # Per-adapter inbound bearer tokens. Empty means open route.
  OWUI_AUTH_TOKEN: "${OWUI_AUTH_TOKEN:-}"
  JINA_AUTH_TOKEN: "${JINA_AUTH_TOKEN:-}"

services:
  llm-context-loader:
    build:
      context: .
    image: "${LLMC_LOCAL_IMAGE:-llm-context-loader:local}"
    container_name: llm-context-loader
    restart: unless-stopped
    ports:
      - "${PORT:-3010}:${PORT:-3010}"
    environment: *llmc-environment
    volumes:
      - ./config:/app/config:ro
      - ./templates:/app/templates:ro
